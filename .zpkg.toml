[package]
org = "memebank"
name = "memebank-sidecar"
version = "0.1.0"
description = "k8s sidecar for Memebank."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/memebank/memebank-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin memebank-sidecar"
outputs = ["target/release/memebank-sidecar"]

[bin]
memebank-sidecar = "target/release/memebank-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
